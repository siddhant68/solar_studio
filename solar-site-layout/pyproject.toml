[project]
name = "solar-site-layout"
version = "0.1.0"
description = "Module 01 of Solar Studio: flat-site boundary and table rules to verified panel layout, capacity, drawings and coordinates"
readme = "README.md"
# Licence: not yet decided by the repository owner. Apache-2.0 is proposed for the new
# code (see README "Licence"); no licence is declared until the owner confirms one.
requires-python = ">=3.12"
dependencies = [
    "shapely>=2.1",
    "numpy>=2.1",
    "ezdxf>=1.4",
    "jsonschema>=4.23",
    "starlette>=0.46",
    "uvicorn>=0.34",
    "mcp>=1.20",
]

[project.scripts]
solar-layout = "solar_layout.cli:main"
solar-layout-mcp = "solar_layout.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "psutil>=6.1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solar_layout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
